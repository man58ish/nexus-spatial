<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Metadata -->
    <title>Nexus Spatial // 3D Digital Twin & P2P Collaboration Canvas</title>
    <meta name="description" content="High-Performance 3D Digital Twin, WebGL Shaders, Web Workers, and Low-Latency WebRTC Spatial Collaboration Studio." />
    <meta name="theme-color" content="#0f1115" />

    <!-- Google Fonts Preconnect for Inter & Studio Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Minimal SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233b82f6'/><path d='M30 50 L50 30 L70 50 L50 70 Z' fill='white'/></svg>" />

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #0f1115;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
      }

      nexus-spatial {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Nexus Spatial Root Web Component -->
    <nexus-spatial></nexus-spatial>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
